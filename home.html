{% extends "base.html" %}
{% block content %}
<h2>All Posts</h2>
{% for post in posts %}
  <div class="card mb-3">
    <div class="card-body">
      <h4>{{ post.title }}</h4>
      <p>{{ post.content[:150] }}...</p>
      <a href="/post/{{ post.id }}">Read More</a>
    </div>
  </div>
{% endfor %}
{% endblock %}
